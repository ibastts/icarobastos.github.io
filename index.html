<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ícaro Bastos — Currículo Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scanlines"></div>

<header class="topbar">
  <div class="topbar-left">
    <span class="dot"></span>
    <span class="topbar-label">curriculo.json</span>
  </div>
  <div class="topbar-right" id="statusLine">GET /api/profile</div>
</header>

<main class="boot" id="bootScreen">
  <pre id="bootLog"></pre>
</main>

<div class="app" id="app" hidden>

  <aside class="profile-card">
    <div class="avatar">IB</div>
    <h1 class="name" id="p-name"></h1>
    <p class="role" id="p-role"></p>
    <p class="location" id="p-location"></p>
    <div class="status-pill">
      <span class="pulse"></span>
      <span id="p-status"></span>
    </div>
    <p class="summary" id="p-summary"></p>
    <div class="contact">
      <a id="p-email" href="#" class="contact-link"></a>
      <a id="p-linkedin" href="#" target="_blank" rel="noopener" class="contact-link">LinkedIn ↗</a>
    </div>
  </aside>

  <div class="main-col">

    <section class="panel" data-panel>
      <button class="panel-title" type="button" aria-expanded="false" aria-controls="skills-body">
        <span class="panel-title-text">// SKILL TREE</span>
        <span class="panel-title-meta">
          <span class="endpoint-tag">GET /api/skills</span>
          <span class="chevron">▾</span>
        </span>
      </button>
      <p class="panel-summary" id="skills-summary"></p>
      <div class="panel-body" id="skills-body">
        <div class="panel-body-inner">
          <div class="skill-group">
            <h3 class="skill-group-title">Domínio</h3>
            <div id="skills-mastered" class="skill-list"></div>
          </div>
          <div class="skill-group">
            <h3 class="skill-group-title">Em desenvolvimento</h3>
            <div id="skills-learning" class="skill-list"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel" data-panel>
      <button class="panel-title" type="button" aria-expanded="false" aria-controls="experience-body">
        <span class="panel-title-text">EXPERIENCE // MISSION LOG</span>
        <span class="panel-title-meta">
          <span class="endpoint-tag">GET /api/experience</span>
          <span class="chevron">▾</span>
        </span>
      </button>
      <p class="panel-summary" id="experience-summary"></p>
      <div class="panel-body" id="experience-body">
        <div class="panel-body-inner">
          <div id="experience-log" class="timeline"></div>
        </div>
      </div>
    </section>

    <section class="panel" data-panel>
      <button class="panel-title" type="button" aria-expanded="false" aria-controls="projects-body">
        <span class="panel-title-text">PROJECTS // QUEST LOG</span>
        <span class="panel-title-meta">
          <span class="endpoint-tag">GET /api/projects</span>
          <span class="chevron">▾</span>
        </span>
      </button>
      <p class="panel-summary" id="projects-summary"></p>
      <div class="panel-body" id="projects-body">
        <div class="panel-body-inner">
          <div id="projects-list" class="project-grid"></div>
        </div>
      </div>
    </section>

    <section class="panel" data-panel>
      <button class="panel-title" type="button" aria-expanded="false" aria-controls="education-body">
        <span class="panel-title-text">// EDUCATION</span>
        <span class="panel-title-meta">
          <span class="endpoint-tag">GET /api/education</span>
          <span class="chevron">▾</span>
        </span>
      </button>
      <p class="panel-summary" id="education-summary"></p>
      <div class="panel-body" id="education-body">
        <div class="panel-body-inner">
          <div id="education-list"></div>
        </div>
      </div>
    </section>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
